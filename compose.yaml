name: london-monitor

services:
  app:
    build: .
    environment:
      LONDON_MODE: ${LONDON_MODE:-live}
      LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER}
      LONDON_DATA_DIR: /app/.runtime
      QDRANT_URL: http://qdrant:6333
      DDGS_BACKEND: ${DDGS_BACKEND:-auto}
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN}
      EMBEDDING_CACHE: /app/.runtime/embeddings
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_API_BASE: ${ZAI_API_BASE:-}
      ZAI_MODEL: ${ZAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-runtime:/app/.runtime
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    networks: [backend]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12

  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN}
    networks: [backend]
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  app-runtime:
  qdrant-data:
